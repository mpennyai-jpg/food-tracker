<title>Todd's Watch Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one archive column — sticky filter rail, then Movies and Television, each split into genre bands of ranked rows. */
:root{
  --paper:#eceff3; --card:#fbfcfd; --band:#e3e8ee;
  --ink:#141a21; --ink-soft:#5c6875; --ink-faint:#8795a3;
  --rule:#d2d9e1; --rule-soft:#e1e6ec;
  --brass:#8a5712; --brass-tint:rgba(138,87,18,.10);
  --low:#8d7f7a;
  --f-disp:"Saira Condensed","Oswald","Arial Narrow",sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1217; --card:#161c23; --band:#131921;
  --ink:#e7ecf1; --ink-soft:#97a4b2; --ink-faint:#6d7b8a;
  --rule:#242c36; --rule-soft:#1c232c;
  --brass:#e2a54c; --brass-tint:rgba(226,165,76,.12);
  --low:#9b8d86; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e1217; --card:#161c23; --band:#131921;
  --ink:#e7ecf1; --ink-soft:#97a4b2; --ink-faint:#6d7b8a;
  --rule:#242c36; --rule-soft:#1c232c;
  --brass:#e2a54c; --brass-tint:rgba(226,165,76,.12);
  --low:#9b8d86; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);
  font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:62rem;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
header.mast{padding-block:2.6rem 1.4rem;border-bottom:2px solid var(--ink)}
.eyebrow{font-family:var(--f-data);font-size:.68rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--brass);margin:0 0 .7rem}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(2.6rem,9vw,4.6rem);
  line-height:.92;letter-spacing:-.01em;margin:0;text-wrap:balance;text-transform:uppercase}
.standfirst{max-width:34em;color:var(--ink-soft);margin:1rem 0 0;font-size:1.02rem}
.standfirst b{color:var(--ink);font-weight:500}
.tallies{display:flex;flex-wrap:wrap;gap:.35rem 1.6rem;margin:1.5rem 0 0;padding:0;list-style:none}
.tallies li{font-family:var(--f-data);font-size:.76rem;letter-spacing:.04em;
  color:var(--ink-faint);text-transform:uppercase}
.tallies b{font-family:var(--f-disp);font-size:1.5rem;font-weight:600;color:var(--ink);
  display:block;letter-spacing:0;font-variant-numeric:tabular-nums}

/* genre jump */
.genres{display:flex;flex-direction:column;gap:.5rem;padding-block:1.3rem .1rem;
  scroll-margin-top:5rem}
.chiprow{display:grid;grid-template-columns:5.4rem minmax(0,1fr);gap:.45rem .7rem;align-items:start}
.chiplabel{font-family:var(--f-data);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);padding-top:.42rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem;min-width:0}
.chip{font-family:var(--f-disp);font-weight:600;font-size:.86rem;letter-spacing:.055em;
  text-transform:uppercase;color:var(--ink);text-decoration:none;background:var(--card);
  border:1px solid var(--rule);border-radius:2px;padding:.24rem .5rem;
  display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.chip:hover,.chip:focus-visible{border-color:var(--brass);color:var(--brass);outline:none}
.chip:focus-visible{box-shadow:0 0 0 2px var(--brass-tint)}
.chip .k{font-family:var(--f-data);font-size:.64rem;font-weight:400;letter-spacing:.02em;
  color:var(--ink-faint);font-variant-numeric:tabular-nums}
.chip.off{opacity:.34;pointer-events:none}
@media (max-width:31rem){
  .chiprow{grid-template-columns:1fr;gap:.25rem}
  .chiplabel{padding-top:.2rem}
  .chip{font-size:.8rem;padding:.22rem .44rem}
}

/* sticky rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);
  border-bottom:1px solid var(--rule)}
.rail .wrap{display:flex;gap:.6rem;align-items:center;padding-block:.6rem;flex-wrap:wrap}
.rail label{font-family:var(--f-data);font-size:.66rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint)}
#q{flex:1 1 11rem;min-width:0;font:inherit;font-size:.92rem;padding:.42rem .6rem;
  background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:2px}
#q:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.jump{display:flex;gap:.3rem}
.jump a{font-family:var(--f-data);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);text-decoration:none;padding:.42rem .55rem;border:1px solid var(--rule);
  border-radius:2px;white-space:nowrap}
.jump a:hover,.jump a:focus-visible{color:var(--brass);border-color:var(--brass)}
#hits,.pcount{font-family:var(--f-data);font-size:.72rem;color:var(--ink-faint);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pcount{color:var(--brass)}

/* sections */
section.medium{padding-block:2.6rem 1rem;scroll-margin-top:5rem}
.medium-head{display:flex;align-items:baseline;gap:.8rem;border-bottom:1px solid var(--ink);
  padding-bottom:.4rem;margin-bottom:.2rem}
.medium-head h2{font-family:var(--f-disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(1.5rem,4.5vw,2.1rem);letter-spacing:.02em;margin:0}
.medium-head .n{font-family:var(--f-data);font-size:.74rem;color:var(--ink-faint);margin-left:auto;
  font-variant-numeric:tabular-nums;white-space:nowrap}

.genre{padding-block:1.7rem .2rem;scroll-margin-top:5rem}
.genre-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.55rem}
.genre-head h3{font-family:var(--f-disp);font-weight:600;font-size:1.06rem;letter-spacing:.1em;
  text-transform:uppercase;margin:0;color:var(--brass)}
.genre-head .bar{flex:1;height:1px;background:var(--rule)}
.genre-head .c{font-family:var(--f-data);font-size:.7rem;color:var(--ink-faint);
  font-variant-numeric:tabular-nums}

/* rows */
ol.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;
  background:var(--rule-soft);border-block:1px solid var(--rule-soft)}
li.row{background:var(--card);display:grid;gap:.15rem .95rem;padding:.8rem .85rem;
  grid-template-columns:3.8rem minmax(0,1fr) auto;align-items:start;align-content:start}
li.row[hidden]{display:none!important}

.art{grid-column:1;grid-row:1/span 2;width:3.8rem;aspect-ratio:2/3;max-width:100%;border-radius:2px;
  overflow:hidden;background:var(--band);position:relative;
  display:flex;align-items:center;justify-content:center}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art{border:1px solid var(--rule-soft)}
.art .fb{font-family:var(--f-disp);font-weight:700;font-size:1.02rem;letter-spacing:.06em;
  color:var(--ink-faint);text-align:center;padding:.15rem;line-height:1;
  overflow:hidden;text-transform:uppercase;
  background:linear-gradient(160deg,var(--band),var(--rule-soft));
  width:100%;height:100%;display:flex;align-items:center;justify-content:center}

.name{grid-column:2;grid-row:1;font-family:var(--f-disp);font-weight:600;font-size:1.2rem;
  line-height:1.2;letter-spacing:.005em;margin:0;align-self:start;padding-top:.1rem}
.name .yr{font-family:var(--f-data);font-size:.72rem;font-weight:400;color:var(--ink-faint);
  letter-spacing:.02em;margin-left:.45rem;white-space:nowrap}
.blurb{grid-column:2;grid-row:2;margin:.1rem 0 0;font-size:.93rem;line-height:1.5;color:var(--ink-soft);
  max-width:62ch}

.score{grid-column:3;grid-row:1/span 2;text-align:right;display:flex;flex-direction:column;
  align-items:flex-end;gap:.25rem;padding-top:.1rem}
.num{font-family:var(--f-disp);font-weight:700;font-size:1.5rem;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:0}
.pips{display:flex;gap:2px}
.pip{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.pip.on{background:currentColor}
.pip.half{background:linear-gradient(90deg,currentColor 50%,var(--rule) 50%)}
.t-top{color:var(--brass)}
.t-mid{color:var(--ink)}
.t-low{color:var(--ink-faint)}
.t-bad{color:var(--low)}
.t-none{color:var(--ink-faint)}
.num.t-none{font-size:.78rem;font-family:var(--f-data);letter-spacing:.1em;text-transform:uppercase;font-weight:500}

/* queue + colophon */
.note{font-size:.9rem;color:var(--ink-soft);margin:.9rem 0 0;max-width:58ch}
footer{border-top:2px solid var(--ink);margin-top:2.6rem;padding-block:1.4rem 2.6rem}
footer p{font-size:.86rem;color:var(--ink-faint);max-width:58ch;margin:0 0 .6rem}
footer .sig{font-family:var(--f-data);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}
.empty{padding:1.6rem .2rem;color:var(--ink-faint);font-size:.95rem}

@media (max-width:31rem){
  li.row{grid-template-columns:3.1rem minmax(0,1fr);gap:.1rem .75rem}
  .art{grid-column:1;grid-row:1/span 2;width:3.1rem}
  .name{grid-column:2;grid-row:1;font-size:1.1rem;padding-top:0}
  .score{grid-column:2;grid-row:2;flex-direction:row;align-items:center;gap:.5rem;
    justify-content:flex-start;text-align:left;padding-top:.1rem}
  .num{font-size:1.1rem}
  .blurb{grid-column:1/-1;grid-row:3;margin-top:.5rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
